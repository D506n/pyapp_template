[project]
name = "pyapp-template"
version = "0.1.0"
description = "Copier generator for async Python services"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = ["copier>=9.11,<10"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "httpx>=0.28,<1",
    "ruff>=0.14,<1", "bandit>=1.8,<2", "pip-audit>=2.9,<3",
    "fastapi>=0.121,<1", "uvicorn>=0.38,<1", "fastmcp>=4.2,<5",
    "sqlalchemy[asyncio]>=2.0.44,<3", "asyncpg>=0.31,<1",
    "aiosqlite>=0.21,<1", "asyncmy>=0.2.10,<1", "alembic>=1.17,<2",
    "pydantic-settings>=2.11,<3",
]

[tool.ruff]
target-version = "py314"
line-length = 100
force-exclude = true
extend-exclude = ["tests", "test_*.py", "*_test.py", "conftest.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
