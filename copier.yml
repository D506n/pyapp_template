_min_copier_version: "9.19.1"
_subdirectory: template
_answers_file: .copier-answers.yml
_envops:
  trim_blocks: true
  lstrip_blocks: true
_message_before_copy: |
  Создание самостоятельного сервиса Python 3.14.
  Имя проекта берётся из каталога назначения. Установка зависимостей — только по согласию.
_message_after_copy: |
  Файлы проекта созданы.
  {% if install_dependencies and not _copier_conf.skip_tasks and not _copier_conf.pretend %}
  Установка зависимостей завершена.
  {% else %}
  Установка не выполнялась. Для ручной подготовки из каталога проекта:
    uv lock
    uv sync --locked
  {% endif %}
  Запуск из каталога проекта: uv run main.py
# Copier передаёт операцию в динамические исключения, но не в validators вопросов.
# Пустой результат ничего не исключает; mandatory останавливает copy до записи файлов.
# При update сохранённое имя используется и во временных каталогах Copier.
_exclude:
  - copier.yml
  - copier.yaml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - >-
    {% if _copier_operation == 'copy' and project_name != _folder_name %}
    {{ {}['invalid'] | mandatory('Имя проекта должно совпадать с именем каталога назначения; не передавайте другое project_name.') }}
    {% elif _copier_operation == 'copy' and install_dependencies and _copier_conf.cleanup_on_error and not _copier_conf.skip_tasks and not _copier_conf.pretend %}
    {{ {}['invalid'] | mandatory('Для установки с сохранением файлов при ошибке повторите copier copy с флагами --trust --no-cleanup; для API задайте cleanup_on_error=False.') }}
    {% endif %}

_tasks:
  - command: [uv, sync]
    when: "{{ install_dependencies and _copier_operation == 'copy' and not _copier_conf.pretend }}"

project_name:
  type: str
  default: "{{ _folder_name }}"
  ask: false
description:
  type: str
  help: Описание сервиса
  default: Асинхронный Python-сервис
author_name:
  type: str
  help: Имя автора
  default: Автор проекта
project_license:
  type: str
  help: Выберите лицензию проекта отдельно от лицензии шаблона
  choices:
    MIT: MIT
    Без лицензии проекта: none
use_http_api:
  type: bool
  help: Добавить HTTP API?
  default: true
http_framework:
  type: str
  help: HTTP-фреймворк
  choices:
    FastAPI: fastapi
  default: fastapi
  when: "{{ use_http_api }}"
use_mcp:
  type: bool
  help: Добавить MCP?
  default: false
  validator: >-
    {% if not use_http_api and not use_mcp %}Включите хотя бы один интерфейс — HTTP API или MCP.{% endif %}
mcp_transport:
  type: str
  help: Транспорт MCP
  choices:
    HTTP: http
    Стандартный ввод и вывод (stdio): stdio
  default: http
  when: "{{ use_mcp and not use_http_api }}"
database:
  type: str
  help: База данных
  choices:
    Без базы данных: none
    PostgreSQL: postgresql
    SQLite: sqlite
    MySQL: mysql
  default: none
use_alembic:
  type: bool
  help: Добавить миграции Alembic?
  default: false
  when: "{{ database != 'none' }}"
settings_backend:
  type: str
  help: Способ чтения настроек
  choices:
    "os.getenv(...) — без внешних зависимостей": getenv
    magutils.env: magutils
    pydantic_settings: pydantic_settings
  default: getenv
use_magutils:
  type: bool
  help: Добавить magutils?
  default: "{{ settings_backend == 'magutils' }}"
  when: "{{ settings_backend != 'magutils' }}"
use_http_client:
  type: bool
  help: Добавить HTTP-клиент httpx?
  default: false
install_dependencies:
  type: bool
  help: Установить зависимости сейчас?
  default: false
  validator: >-
    {% set reserved_distributions = [
      "aiofile", "aiosqlite", "alembic", "annotated-doc", "annotated-types", "anyio", "asyncmy",
      "asyncpg", "attrs", "authlib", "bandit", "beartype", "boolean-py", "cachecontrol",
      "cachetools", "caio", "certifi", "cffi", "charset-normalizer", "click", "colorama", "copier",
      "cryptography", "cyclonedx-python-lib", "cyclopts", "defusedxml", "dnspython",
      "docstring-parser", "dunamai", "editables", "email-validator", "exceptiongroup", "fastapi",
      "fastmcp", "fastmcp-slim", "filelock", "funcy", "greenlet", "griffelib", "h11", "hatchling",
      "httpcore", "httpcore2", "httpx", "httpx2", "httpx2-jsfetch", "idna", "iniconfig", "jinja2",
      "jinja2-ansible-filters", "joserfc", "jsonref", "jsonschema", "jsonschema-path",
      "jsonschema-specifications", "license-expression", "magutils", "aiolimiter", "babel", "cron-parser-py", "dotenv", "fastnanoid", "orjson", "starlark-pyo3", "tzdata", "mako", "markdown-it-py", "markupsafe",
      "mcp", "mcp-types", "mdurl", "msgpack", "openapi-pydantic", "opentelemetry-api",
      "packageurl-python", "packaging", "pathable", "pathspec", "pip", "pip-api", "pip-audit",
      "pip-requirements-parser", "platformdirs", "pluggy", "plumbum", "prompt-toolkit",
      "py-key-value-aio", "py-serializable", "pycparser", "pydantic", "pydantic-core",
      "pydantic-settings", "pygments", "pyjwt", "pyparsing", "pyperclip", "pytest", "pytest-asyncio",
      "python-dotenv", "python-multipart", "pywin32", "pyyaml", "questionary", "referencing",
      "requests", "rich", "rich-rst", "rpds-py", "ruff", "sortedcontainers", "sqlalchemy",
      "sse-starlette", "starlette", "stevedore", "tomli", "tomli-w", "trove-classifiers",
      "truststore", "typing-extensions", "typing-inspection", "uncalled-for", "urllib3", "uvicorn",
      "watchfiles", "wcwidth", "websockets"
    ] %}
    {% if not (project_name | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*\Z')) or project_name|length > 64 %}
    Имя каталога должно содержать до 64 строчных латинских букв, цифр и одиночных дефисов, начиная с буквы.
    {% elif project_name in reserved_distributions %}
    Выберите имя каталога, не совпадающее с поддерживаемой зависимостью.
    {% elif not use_http_api and not use_mcp %}Включите хотя бы один интерфейс — HTTP API или MCP.
    {% elif http_framework != 'fastapi' %}Поддерживается только FastAPI.
    {% elif use_http_api and use_mcp and mcp_transport != 'http' %}Совместные HTTP API и MCP требуют транспорта http.
    {% elif database == 'none' and use_alembic %}Alembic требует SQL-БД.
    {% endif %}
