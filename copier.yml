description:
  type: str
  default: Async Python service
author_name:
  type: str
  default: Your Name
project_license:
  type: str
  help: Choose the generated project's license explicitly; the template license is separate.
  choices: [MIT, none]
use_http_api:
  type: bool
  default: true
http_framework:
  type: str
  choices: [fastapi]
  default: fastapi
  when: "{{ use_http_api }}"
use_mcp:
  type: bool
  default: false
  validator: >-
    {% if not use_http_api and not use_mcp %}Enable at least one interface: HTTP API or MCP.{% endif %}
mcp_transport:
  type: str
  choices: [http, stdio]
  default: http
  when: "{{ use_mcp and not use_http_api }}"
database:
  type: str
  choices: [none, postgresql, sqlite, mysql]
  default: none
use_alembic:
  type: bool
  default: false
  when: "{{ database != 'none' }}"
use_settings:
  type: bool
  default: true
use_http_client:
  type: bool
  default: false
  validator: >-
    {% if not use_http_api and not use_mcp %}Enable at least one interface: HTTP API or MCP.
    {% elif http_framework != 'fastapi' %}Only fastapi is supported.
    {% elif use_http_api and use_mcp and mcp_transport != 'http' %}Combined HTTP API and MCP require mcp_transport=http.
    {% elif database == 'none' and use_alembic %}Alembic requires a SQL database.
    {% endif %}
